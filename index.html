<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SECOND-BRAIN // Offline-First Markdown Knowledge Base</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FFFFFF',
            dim: '#F4F1FA',
            ink: '#0A090D',
            obsidian: '#0A0812',
            purple: {
              DEFAULT: '#7C3AED',
              deep: '#5B1AA0',
              mid: '#9333EA',
              light: '#C06BF0',
              soft: '#DDD6FE',
              ink: '#1B0E33'
            }
          },
          fontFamily: {
            display: ['Anton', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
            body: ['Archivo', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Marked.js Markdown Compiler -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Zerotsudios UI Core Stylesheet & App Custom Overrides -->
  <link rel="stylesheet" href="css/zerotsudios.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#FFFFFF] text-[#0A090D] font-body selection:bg-[#7C3AED] selection:text-white flex flex-col h-screen">

  <!-- Top System Bar -->
  <header class="bg-white border-b-2 border-[#0A090D] px-4 py-2 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <img src="assets/zerotsudios-logo.png" alt="Zerotsu Logo" class="h-7 w-auto">
      <div class="flex flex-col">
        <span class="font-display text-base tracking-wide uppercase leading-none">ZEROTSU - STUDIO</span>
        <span class="font-mono text-[9px] text-[#7C3AED] tracking-widest font-bold">SECOND-BRAIN // DOSSIER VAULT</span>
      </div>
    </div>

    <!-- Actions & Storage Indicators -->
    <div class="flex items-center gap-2">
      <span class="badge-lilac text-[10px] hidden sm:inline-block">OFFLINE FIRST</span>
      <button id="btn-new-note" class="btn-purple text-xs py-1.5 px-3">
        + NEW NOTE
      </button>
      <button id="btn-toggle-preview" class="btn-solid text-xs py-1.5 px-3">
        TOGGLE PREVIEW
      </button>

      <div class="h-5 w-[2px] bg-[#0A090D] mx-1 hidden sm:block"></div>

      <!-- Vault Backup Dropdown/Triggers -->
      <button id="btn-export-vault" class="btn-outline text-xs py-1.5 px-2 hidden sm:inline-block" title="Backup whole vault to JSON">
        BACKUP VAULT
      </button>
      <label class="btn-outline text-xs py-1.5 px-2 cursor-pointer hidden sm:inline-block" title="Restore notes from JSON backup">
        RESTORE
        <input type="file" id="import-vault-input" accept=".json" class="hidden">
      </label>
    </div>
  </header>

  <!-- 3-Column Mechanical Workspace Grid -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR: Notes Directory -->
    <aside class="w-80 border-r-2 border-[#0A090D] bg-[#F4F1FA] flex flex-col shrink-0">
      <div class="title-bar border-b-2 border-[#0A090D] shrink-0">
        <span>ARCHIVE // NOTES</span>
        <span id="notes-count-badge" class="text-[#C06BF0]">0 NOTES</span>
      </div>

      <!-- Quick Search Bar -->
      <div class="p-3 border-b-2 border-[#0A090D] bg-white shrink-0">
        <input 
          type="text" 
          id="search-input" 
          class="input-brutal w-full text-xs" 
          placeholder="SEARCH NOTES OR TAGS..."
        >
      </div>

      <!-- Scrollable Note List -->
      <div id="notes-list" class="flex-1 overflow-y-auto p-3">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- CENTER PANEL: Mechanical Editor Canvas -->
    <section class="flex-1 flex flex-col bg-white overflow-hidden">
      <!-- Document Controls & Title Bar -->
      <div class="title-bar border-b-2 border-[#0A090D] flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 flex-1">
          <span class="w-2.5 h-2.5 bg-[#7C3AED] inline-block"></span>
          <input 
            type="text" 
            id="note-title-input" 
            class="bg-transparent border-none outline-none font-display text-sm tracking-wide uppercase text-white flex-1 focus:ring-0" 
            placeholder="NOTE TITLE..."
          >
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-pin-note" class="btn-outline text-[10px] py-0.5 px-2">PIN</button>
          <button id="btn-export-md" class="btn-outline text-[10px] py-0.5 px-2">EXPORT .MD</button>
          <button id="btn-delete-note" class="btn-solid text-[10px] py-0.5 px-2 bg-red-600 hover:bg-red-700 text-white border-red-900">DELETE</button>
        </div>
      </div>

      <!-- Scratchpad Monospace Textarea -->
      <div class="flex-1 flex p-4 overflow-hidden">
        <textarea 
          id="note-content-textarea" 
          class="w-full h-full resize-none border-2 border-[#0A090D] p-4 font-mono text-sm leading-relaxed text-[#0A090D] bg-white shadow-[4px_4px_0_#0A090D] focus:outline-none focus:ring-2 focus:ring-[#7C3AED]"
          placeholder="Start writing markdown content here..."
        ></textarea>
      </div>

      <!-- Bottom Telemetry HUD Status Strip -->
      <div class="panel-dark border-t-2 border-[#0A090D] px-4 py-2 flex items-center justify-between shrink-0 font-mono text-xs">
        <div class="flex items-center gap-4 text-[#DDD6FE]">
          <span id="telemetry-word-count">0 WORDS</span>
          <span class="text-[#38225C]">/</span>
          <span id="telemetry-char-count">0 CHARS</span>
          <span class="text-[#38225C]">/</span>
          <span id="telemetry-read-time">1 MIN READ</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 bg-[#4EE085] rounded-full inline-block"></span>
          <span id="save-status-text" class="text-[#4EE085] font-bold">SAVED // LOCAL (IDB)</span>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: Live Compiled Markdown Dossier (Collapsible) -->
    <aside id="preview-panel" class="w-96 border-l-2 border-[#0A090D] bg-white flex flex-col shrink-0 overflow-hidden">
      <div class="title-bar border-b-2 border-[#0A090D] shrink-0">
        <span>PREVIEW // LIVE DOSSIER</span>
        <span class="text-[#C06BF0]">COMPILED</span>
      </div>
      <div id="markdown-preview-output" class="markdown-body flex-1 overflow-y-auto p-6 bg-white">
        <!-- Rendered markdown preview -->
      </div>
    </aside>

  </div>

  <!-- Zerotsudios Micro-interactions & Toast System -->
  <script src="js/zerotsudios.js"></script>
  <!-- Storage Engine -->
  <script src="js/db.js"></script>
  <!-- Workspace Controller -->
  <script src="js/app.js"></script>
</body>
</html>
